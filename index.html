<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="description" content="TRAKOMAN Material Catalog">
<title>TRAKOMAN | MATERIAL CATALOG</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#080a0f;color:#f4f5f7;font-family:Arial,"Noto Sans JP",sans-serif;min-height:100vh}.wrap{width:min(100%,1100px);margin:auto;padding:0 16px 60px}.hero{position:relative;margin:0 -16px 24px;padding:48px 22px 34px;overflow:hidden;background:linear-gradient(145deg,#10141c,#080a0f 60%,#121722);border-bottom:1px solid #292e38}.hero:before{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff14;border-radius:50%;right:-80px;top:-80px}.hero:after{content:"";position:absolute;width:140px;height:140px;border:1px solid #ffffff0c;transform:rotate(45deg);right:20px;bottom:-80px}.eyebrow{font-size:10px;letter-spacing:4px;color:#8e98a8;font-weight:bold}.hero h1{margin:9px 0 5px;font-size:clamp(34px,10vw,72px);line-height:.9;letter-spacing:-2px;font-style:italic}.hero h1 span{display:block;color:#7f8a9b;font-size:.43em;letter-spacing:3px;margin-top:12px;font-style:normal}.hero p{margin:20px 0 0;max-width:600px;color:#aeb5c0;font-size:13px;line-height:1.8}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.count{font-size:11px;color:#818b9b;letter-spacing:1px}.search{position:relative;margin-bottom:14px}.search input{width:100%;height:48px;padding:0 16px 0 45px;border:1px solid #2a303b;border-radius:12px;background:#10131a;color:#fff;font-size:14px;outline:none}.search input:focus{border-color:#697486}.search:before{content:"⌕";position:absolute;z-index:2;left:16px;top:10px;font-size:23px;color:#778192}.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:none;border:1px solid #2a303b;background:#10131a;color:#9ba4b2;border-radius:999px;padding:9px 13px;font-size:10px;letter-spacing:.7px;cursor:pointer}.filter.active{background:#f4f5f7;color:#080a0f;border-color:#f4f5f7}.grid{display:grid;grid-template-columns:1fr;gap:12px}.card{position:relative;overflow:hidden;border:1px solid #262c36;border-radius:16px;background:#10131a;transition:.2s}.card:hover{border-color:#566172;transform:translateY(-2px)}.preview{height:190px;background:repeating-linear-gradient(135deg,#11151d 0,#11151d 12px,#0d1016 12px,#0d1016 24px);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.preview.has-image{background:#111}.preview img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{font-size:10px;letter-spacing:3px;color:#596373;text-align:center}.number{position:absolute;left:12px;top:12px;background:#080a0fcc;border:1px solid #ffffff1a;border-radius:6px;padding:5px 7px;font-size:9px;color:#c9ced6;letter-spacing:1px}.info{padding:15px}.type{font-size:9px;color:#727d8d;letter-spacing:2px;margin-bottom:7px}.name{font-size:19px;font-weight:700;letter-spacing:-.4px}.id{display:inline-block;margin-top:9px;padding:6px 8px;border-radius:6px;background:#080a0f;border:1px solid #303744;font-family:monospace;font-size:12px;color:#fff;letter-spacing:1px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.btn{height:38px;border-radius:8px;border:1px solid #343b47;background:#171b23;color:#e9ebef;font-size:10px;font-weight:bold;letter-spacing:1.2px;cursor:pointer}.btn.copy{background:#f4f5f7;color:#080a0f;border-color:#f4f5f7}.empty{text-align:center;padding:60px 20px;color:#697383;border:1px dashed #29303a;border-radius:15px}.footer{margin-top:38px;padding-top:20px;border-top:1px solid #252a33;color:#697383;text-align:center;font-size:10px;letter-spacing:1.5px;line-height:1.8}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modal-box{width:min(100%,650px);max-height:90vh;overflow:auto;background:#10131a;border:1px solid #353c49;border-radius:18px;box-shadow:0 20px 70px #000;position:relative}.modal-close{position:absolute;right:12px;top:12px;width:34px;height:34px;border:1px solid #555e6d;border-radius:50%;background:#080a0fcc;color:#fff;font-size:18px;cursor:pointer;z-index:2}.modal-preview{min-height:300px;display:flex;align-items:center;justify-content:center;background:#0b0e14}.modal-preview img{max-width:100%;max-height:65vh;display:block}.modal-text{padding:20px}.modal-text small{color:#737e8e;letter-spacing:2px}.modal-text h2{margin:7px 0;font-size:26px}.modal-code{font-family:monospace;background:#080a0f;padding:10px;border-radius:7px;color:#fff;display:inline-block;margin-top:5px}@media(min-width:650px){.wrap{padding-left:24px;padding-right:24px}.hero{margin-left:-24px;margin-right:-24px;padding-left:40px;padding-right:40px}.grid{grid-template-columns:repeat(2,1fr)}.preview{height:220px}}@media(min-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">TRAKOMAN CREATION</div>
<h1>MATERIAL<span>CATALOG</span></h1>
<p>Browse visual materials created for character pages and creative projects. Find a material, preview it, and copy its identifier code.</p>
</header>

<div class="bar">
<strong>ALL MATERIALS</strong>
<span class="count" id="count">0 ITEMS</span>
</div>

<div class="search">
<input id="search" type="search" placeholder="Search name, ID, category...">
</div>

<div class="filters" id="filters"></div>

<main class="grid" id="grid"></main>

<footer class="footer">
TRAKOMAN MATERIAL CATALOG<br>
CREATED FOR CREATIVE USE
</footer>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<button class="modal-close" id="close">×</button>
<div class="modal-preview" id="modalPreview"></div>
<div class="modal-text">
<small id="modalType"></small>
<h2 id="modalName"></h2>
<div class="modal-code" id="modalCode"></div>
</div>
</div>
</div>

<script>
const materials=[
{id:"YK-A1-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-A1-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-A2-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-A2-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-A3-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-A3-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-B1-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-B1-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-B2-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-B2-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-C1-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-C1-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-D1-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-D1-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-D2-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-D2-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-D3-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-D3-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-E1-1",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"YK-E1-2",name:"YUME♡KAWA",category:"YUME KAWA",type:"MATERIAL",preview:""},
{id:"NP-A1-1",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-A1-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-A2-1",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-A2-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-A3-1",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-A3-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-B1-1",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-B1-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-B2-1",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-B2-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},

{id:"NP-C1-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-D1-1",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-D1-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-D2-1",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-D2-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-D3-1",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-D3-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-E1-1",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""},
{id:"NP-E1-2",name:"NeonPop",category:"NEON POP",type:"MATERIAL",preview:""}];

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const filters=document.getElementById("filters");
const count=document.getElementById("count");
const modal=document.getElementById("modal");
const modalPreview=document.getElementById("modalPreview");
const modalName=document.getElementById("modalName");
const modalType=document.getElementById("modalType");
const modalCode=document.getElementById("modalCode");
let currentCategory="ALL";

const categories=["ALL",...new Set(materials.map(x=>x.category))];

categories.forEach(cat=>{
const b=document.createElement("button");
b.className="filter"+(cat==="ALL"?" active":"");
b.textContent=cat;
b.onclick=()=>{
currentCategory=cat;
document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
render();
};
filters.appendChild(b);
});

function render(){
const q=search.value.toLowerCase().trim();
const list=materials.filter(x=>{
const matchCat=currentCategory==="ALL"||x.category===currentCategory;
const matchSearch=!q||[x.id,x.name,x.category,x.type].join(" ").toLowerCase().includes(q);
return matchCat&&matchSearch;
});
count.textContent=list.length+" ITEM"+(list.length===1?"":"S");
grid.innerHTML="";
if(!list.length){
grid.innerHTML='<div class="empty">NO MATERIALS FOUND<br><br>Try another search or category.</div>';
return;
}
list.forEach((m,i)=>{
const card=document.createElement("article");
card.className="card";
const image=m.preview?'<img src="'+m.preview+'" alt="'+m.name+' preview">':'<div class="placeholder">PREVIEW<br>COMING SOON</div>';
card.innerHTML='<div class="preview '+(m.preview?"has-image":"")+'">'+image+'<div class="number">'+String(i+1).padStart(2,"0")+'</div></div><div class="info"><div class="type">'+m.category+" / "+m.type+'</div><div class="name">'+m.name+'</div><div class="id">'+m.id+'</div><div class="actions"><button class="btn previewBtn">PREVIEW</button><button class="btn copy">COPY CODE</button></div></div>';
card.querySelector(".previewBtn").onclick=()=>openModal(m);
card.querySelector(".copy").onclick=e=>copyCode(m.id,e.currentTarget);
grid.appendChild(card);
});
}

function openModal(m){
modalName.textContent=m.name;
modalType.textContent=m.category+" / "+m.type;
modalCode.textContent=m.id;
modalPreview.innerHTML=m.preview?'<img src="'+m.preview+'" alt="'+m.name+' preview">':'<div class="placeholder">PREVIEW<br>COMING SOON</div>';
modal.classList.add("show");
}

function copyCode(id,button){
navigator.clipboard.writeText(id).then(()=>{
const old=button.textContent;
button.textContent="COPIED ✓";
setTimeout(()=>button.textContent=old,1200);
}).catch(()=>{
button.textContent="COPY FAILED";
setTimeout(()=>button.textContent="COPY CODE",1200);
});
}

search.addEventListener("input",render);
document.getElementById("close").onclick=()=>modal.classList.remove("show");
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show")});
render();
</script>
</body>
</html>
